syntax = "proto3";

package librarian;

option go_package = "recon_com.lib.v1;lib";

service Librarian {
  // Отправка файла в ответ на запрос
  rpc SendFile(SendFileRequest) returns (SendFileResponse);

  // Получить список регионов
  rpc GetAllRegions(GetAllRegionsRequest) returns (GetAllRegionsResponse);

  // Получить ссылку для скачивания файла
  rpc GetInfoForDownload(GetInfoForDownloadRequest) returns (GetInfoForDownloadResponse);

  // Получить список источников по фильтру
  // rpc GetSourcesByFilter(GetSourcesByFilterRequest) returns (GetSourcesByFilterResponse) //TODO отложено

  // Передать информацию для сохранения источника
  // rpc UploadSourceInfo(UploadSourceInfoRequest) returns (UploadSourceInfoResponse);
}

