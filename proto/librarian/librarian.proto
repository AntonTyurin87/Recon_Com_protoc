// Тип источника
enum SourceType {
  SOURCE_TYPE_UNKNOWN = 0;
  SOURCE_TYPE_BOOK = 1;
  SOURCE_TYPE_ARTICLE = 2;
  SOURCE_TYPE_FRAGMENT = 3;
  SOURCE_TYPE_PHOTO = 4;
}

// Получить ссылку для скачивания файла
message GetURLForDownloadSourceRequest{
  int64 source_id = 1;
}

message GetURLForDownloadSourceResponse{
  string URLForDownload = 1;
  FileInfo file_info = 2;
}

message FileInfo{
  int64 size = 1;
  string file_name = 2;
  string file_type = 3;
}

// Получить список регионов
message GetAllRegionsRequest{}

message GetAllRegionsResponse{
  repeated Region region = 1;
}

message Region {
  int64 id = 1;
  string name_ru = 2;
  string description = 3;
}
