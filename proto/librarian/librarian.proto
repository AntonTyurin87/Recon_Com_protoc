syntax = "proto3";

package librarian;

option go_package = "recon_com.lib.v1;lib";

service Librarian {
  // Получить список регионов
  rpc GetAllRegions(GetAllRegionsRequest) returns (GetAllRegionsResponse); //TODO починить

  // Получить ссылку для скачивания файла
  rpc GetURLForDownloadSource(GetURLForDownloadSourceRequest) returns (GetURLForDownloadSourceResponse);

  // Получить список источников по фильтру
  // rpc GetSourcesByFilter(GetSourcesByFilterRequest) returns (GetSourcesByFilterResponse) //TODO отложено

  // Передать информацию для сохранения источника
  rpc UploadSourceDataForDownload(UploadSourceDataForDownloadRequest) returns (UploadSourceDataForDownloadResponse);
}

/////////////////////////////////////////////////////////////////

// Передать информацию для сохранения источника
message UploadSourceDataForDownloadRequest {
  int64 userID = 1;
  SourceType source_type = 2;
  string name_ru = 3;
  string name_eng = 4;
  string author_ru = 5;
  int64 year = 6;
  string description = 7;
  string download_url = 8;
  string created_at = 9;
}

message UploadSourceDataForDownloadResponse {
  int64 id = 1;
  bool is_saved = 2;
}

